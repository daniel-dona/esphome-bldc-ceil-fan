substitutions:
  name: pwm-remote
  friendly_name: PWM Remote

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_pin

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/daniel-dona/esphome-bldc-ceil-fan
      ref: main
    components: [ceiling_fan_rf]

remote_transmitter:
  - id: my_tx
    pin: GPIO32
    carrier_duty_percent: 100%

ceiling_fan_rf:
  transmitter_id: my_tx

fan:
  - platform: ceiling_fan_rf
    name: "Ceiling Fan"

select:
  - platform: ceiling_fan_rf
    name: "Fan Timer"

button:
  - platform: ceiling_fan_rf
    name: "Light Cycle"
    button_code: 0x17
  - platform: ceiling_fan_rf
    name: "All Off"
    button_code: 0x19
